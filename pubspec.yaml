name: tubemod_mobile
description: One tool to manage toxic comments in your YouTube channels.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.3.0
  
  # UI Components
  cupertino_icons: ^1.0.6
  
  # State Management
  provider: ^6.1.1
  
  # HTTP & API
  http: ^1.1.0
  
  # Local Storage
  shared_preferences: ^2.0.0
  
  # Google Sign In
  google_sign_in: ^6.1.5
  google_sign_in_android: ^6.2.1

  dio: ^5.4.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: 4.0.9

  flutter_dotenv: ^5.2.1
  
  # Firebase (optional untuk auth)
  # firebase_core: ^2.24.2
  # firebase_auth: ^4.16.0
  
  # YouTube API
  # youtube_player_flutter: ^8.1.2
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - .env
  
  # fonts:
  #   - family: SF Pro Display
  #     fonts:
  #       - asset: assets/fonts/SFProDisplay-Regular.ttf
  #       - asset: assets/fonts/SFProDisplay-Bold.ttf
  #         weight: 700